<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img">
  <title>Warehouse aisle with a blocked exit, a wall extinguisher, a worker in protective gear, a cable across the walkway, and a puddle</title>
  <rect width="1600" height="900" fill="#e7eef2"/>
  <rect x="0" y="520" width="1600" height="380" fill="#c5d0d6"/>
  <g fill="#b7c4cb">
    <rect x="40" y="560" width="1520" height="8"/>
    <rect x="40" y="680" width="1520" height="8"/>
    <rect x="40" y="800" width="1520" height="8"/>
  </g>
  <g>
    <rect x="40" y="70" width="280" height="420" fill="#8aa0ad"/>
    <rect x="70" y="100" width="220" height="28" fill="#d7e0e6"/>
    <rect x="70" y="160" width="220" height="28" fill="#d7e0e6"/>
    <rect x="70" y="220" width="220" height="28" fill="#d7e0e6"/>
    <rect x="1280" y="70" width="280" height="420" fill="#8aa0ad"/>
    <rect x="1310" y="100" width="220" height="28" fill="#d7e0e6"/>
    <rect x="1310" y="160" width="220" height="28" fill="#d7e0e6"/>
    <rect x="1310" y="220" width="220" height="28" fill="#d7e0e6"/>
  </g>
  <!-- blocked emergency exit, top left of the picture -->
  <g id="exit">
    <rect x="120" y="130" width="200" height="280" rx="8" fill="#166534"/>
    <rect x="150" y="160" width="140" height="180" fill="#bbf7d0"/>
    <path d="M210 250 l28-36 28 36 v40 h-56z" fill="#166534"/>
    <circle cx="238" cy="300" r="10" fill="#166534"/>
    <rect x="150" y="360" width="150" height="90" fill="#b45309"/>
    <rect x="170" y="380" width="110" height="70" fill="#d97706"/>
    <rect x="210" y="300" width="120" height="80" fill="#92400e"/>
    <rect x="230" y="318" width="80" height="50" fill="#c2410c"/>
  </g>
  <!-- extinguisher on the wall, safe -->
  <g id="extinguisher">
    <rect x="690" y="90" width="70" height="150" rx="16" fill="#b91c1c"/>
    <rect x="708" y="70" width="34" height="28" rx="6" fill="#374151"/>
    <path d="M742 84 h40 v12 h-40z" fill="#111827"/>
    <rect x="712" y="130" width="26" height="40" rx="4" fill="#fecaca"/>
  </g>
  <!-- worker with hard hat and hi-vis vest, safe -->
  <g id="worker">
    <circle cx="820" cy="390" r="36" fill="#f3d5b5"/>
    <path d="M784 378 h72 l-8 22 h-56z" fill="#facc15"/>
    <rect x="786" y="430" width="68" height="90" rx="10" fill="#f97316"/>
    <rect x="806" y="448" width="28" height="54" fill="#e5e7eb"/>
    <rect x="792" y="516" width="22" height="70" fill="#1f2937"/>
    <rect x="826" y="516" width="22" height="70" fill="#1f2937"/>
    <rect x="760" y="446" width="22" height="60" rx="8" fill="#f97316"/>
    <rect x="858" y="446" width="22" height="60" rx="8" fill="#f97316"/>
  </g>
  <!-- cable across the lower walkway -->
  <g id="cable" fill="none" stroke="#111827" stroke-width="18" stroke-linecap="round">
    <path d="M540 760 C 680 700, 820 820, 980 740 S 1120 800, 1080 700"/>
  </g>
  <rect x="700" y="690" width="36" height="28" rx="4" fill="#374151"/>
  <!-- puddle, bottom right, no warning sign -->
  <g id="puddle">
    <ellipse cx="1320" cy="760" rx="150" ry="48" fill="#38bdf8" opacity="0.85"/>
    <ellipse cx="1280" cy="748" rx="70" ry="22" fill="#e0f2fe" opacity="0.7"/>
  </g>
</svg>
